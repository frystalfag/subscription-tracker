<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilaukset – Tilausvahti</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js" defer></script>
    <script src="js/index.js" defer></script>
  </head>

  <body>
    <header>
      <p>Tilausvahti</p>
      <nav aria-label="Päävalikko">
        <ul>
          <li><a href="index.html" aria-current="page">Tilaukset</a></li>
          <li><a href="calendar.html">Kalenteri</a></li>
          <li><a href="stats.html">Tilastot</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Tilaukset</h1>

      <section aria-labelledby="form-title">
        <h2 id="form-title">Lisää tilaus</h2>

        <form id="add-form" class="form">
          <label for="name">Nimi</label>
          <input type="text" id="name" name="name" list="services" required />
          <datalist id="services">
            <option value="Netflix"></option>
            <option value="Spotify"></option>
            <option value="Disney+"></option>
            <option value="YouTube Premium"></option>
            <option value="HBO Max"></option>
          </datalist>

          <label for="category">Kategoria</label>
          <select id="category" name="category" required>
            <option value="">-- valitse --</option>
            <option value="Viihde">Viihde</option>
            <option value="Musiikki">Musiikki</option>
            <option value="Urheilu">Urheilu</option>
            <option value="Työ">Työ</option>
            <option value="Muu">Muu</option>
          </select>

          <label for="price">Hinta (€)</label>
          <input type="number" id="price" name="price" required min="0" step="0.01" />

          <label for="cycle">Laskutus</label>
          <select id="cycle" name="cycle" required>
            <option value="monthly">Kuukausittain</option>
            <option value="yearly">Vuosittain</option>
          </select>

          <label for="date">Seuraava maksu</label>
          <input type="date" id="date" name="date" required />

          <button type="submit">Lisää</button>
        </form>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
      <div id="subscription-list" class="card-list"></div>

      <dialog id="edit-dialog">
        <h2>Muokkaa tilausta</h2>

        <form id="edit-form" class="form">
          <label for="edit-name">Nimi</label>
          <input type="text" id="edit-name" list="services" required />

          <label for="edit-category">Kategoria</label>
          <select id="edit-category" required>
            <option value="Viihde">Viihde</option>
            <option value="Musiikki">Musiikki</option>
            <option value="Urheilu">Urheilu</option>
            <option value="Työ">Työ</option>
            <option value="Muu">Muu</option>
          </select>

          <label for="edit-price">Hinta (€)</label>
          <input type="number" id="edit-price" required min="0" step="0.01" />

          <label for="edit-cycle">Laskutus</label>
          <select id="edit-cycle" required>
            <option value="monthly">Kuukausittain</option>
            <option value="yearly">Vuosittain</option>
          </select>

          <label for="edit-date">Seuraava maksu</label>
          <input type="date" id="edit-date" required />

          <button type="submit">Tallenna</button>
          <button type="button" id="edit-cancel">Peruuta</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
